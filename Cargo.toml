[package]
name = "serpentium-native"
version = "0.0.1"
edition = "2021"
description = "Rust backends for serpentium: the randium random core and the htmlium html.escape/unescape accelerator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eendebakpt/serpentium"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "num-bigint"] }
num-bigint = "0.4"
num-traits = "0.2"
getrandom = "0.2"
memchr = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
