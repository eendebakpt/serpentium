name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: run the full CPython suite

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # pip drives maturin (the build backend), so no active virtualenv is needed
      # the way `maturin develop` requires. Debug build keeps CI compiles fast.
      - name: Build + install (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Check generated html tables are current
        run: python tools/generate_html_entities.py --check

      - name: Unit + parity tests
        run: pytest -q

      # The load-bearing claim: CPython's own tests for the modules serpentium
      # patches must pass with it installed. Curated, serpentium-affected subset.
      - name: CPython regression suite (curated, serpentium installed)
        run: python tools/cpython_suite.py

  cpython-suite-full:
    # The entire CPython regression suite is slow; run it on demand and weekly
    # rather than on every push, so the curated guard above stays the fast gate.
    name: full CPython suite (py3.14)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build + install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run entire CPython suite under serpentium
        run: python tools/cpython_suite.py --all -- -j0
