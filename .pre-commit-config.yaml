# Hooks for prek (https://github.com/j178/prek) or classic pre-commit; same format.
#   prek install          # install the git hook
#   prek run --all-files  # run everything now
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty has no official hook yet (beta); run Astral's checker via uvx as a local
  # hook, scoped to the library package (tests intentionally poke private APIs).
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uvx ty check python
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
